name: Windows regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - shell: powershell
        run: ./tests/test_migration.ps1
      - shell: powershell
        run: ./tests/test_install.ps1 -PythonPath (Get-Command python.exe).Source
      - shell: powershell
        run: ./tests/test_uninstall.ps1
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - shell: powershell
        run: python tests/package_smoke.py (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
  standalone:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install pyinstaller==6.22.0 -r requirements.txt
      - run: python tests/build_windows.py dist/standalone
      - run: python tests/frozen_smoke.py dist/standalone/frozen/AIQuotaWidget
      - shell: powershell
        run: ./tests/test_setup_exe.ps1 -Installer (Get-ChildItem dist/standalone/*Setup.exe | Select-Object -First 1).FullName
      - shell: powershell
        run: ./tests/test_quick_install.ps1 -ZipPath (Get-ChildItem dist/standalone/*windows-x64.zip | Select-Object -First 1).FullName
